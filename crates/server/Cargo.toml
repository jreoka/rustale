[package]
name = "rustale-server"
version = "0.1.0"
edition = "2021"

[dependencies]
rustale-protocol = { path = "../protocol" }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
